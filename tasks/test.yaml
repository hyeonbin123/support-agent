  user:
    persona: 또렷하고 사무적으로 말한다.
    reason: 출장 가기 전에 받으려고 에어프라이어를 주문했는데 아직 배송준비중이라 출장 전에 못 받을 것 같다. 주문을 취소하고 싶다.
    known: 이름은 공서진, 가입한 이메일은 seojin.kong@example.com이다. 주문 번호는 O-92011이다. 취소 사유는 배송이 너무 늦어서다.
