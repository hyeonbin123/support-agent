[project]
name = "support-agent"
version = "0.1.0"
description = "A Korean customer-support agent that works through tool calls, and a rule-based environment that measures how reliably it does so"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.2,<3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # 상한 <2.1(2026-10-30): 하한만 두면 다음 재잠금이 동작이 바뀐 2.1 계열을 조용히 받아들인다.
    # SQLAlchemy 2.1은 Session이 ORM·Core 문을 가리지 않고 실행할 때마다 먼저 autoflush하고,
    # `Select.filter_by()`가 모든 FROM 엔티티에서 이름을 찾으며(겹치면 AmbiguousColumnError), 드라이버를
    # 적지 않은 `postgresql://`의 기본 드라이버를 psycopg 3으로 바꿨다(공식 문서
    # docs.sqlalchemy.org/en/21/changelog/migration_21.html). 이 저장소는 URL에 드라이버를 적고
    # (`postgresql+psycopg://`) filter_by를 엔티티 하나인 select에서만 써서 지금 바로 걸리는 곳은 없다.
    # 다만 flush 시점이 바뀌면 쓰기 도구의 행 잠금(SELECT … FOR UPDATE)·재고 조건부 UPDATE 순서(7cfb5ad)와
    # 섞여 PostgreSQL 경합에서만 드러날 수 있다. 2.1로 올릴 때는 이 상한을 고치고 전체 pytest, compose db를
    # 띄운 tests/test_postgres.py(두 트랜잭션 경합), tests/test_concurrency.py, 음성 그룹 없이 설치한
    # 환경(CI와 같은 조건)을 통과시킨 뒤 잠금을 갱신한다.
    "sqlalchemy>=2.0.30,<2.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]
# 5단계 음성 채널에서만 쓴다(docs/voice.md): 음성 합성과 인식. 수 GB이고 torch는 GPU 빌드다. 본체의 다른
# 코드는 이 패키지들을 import하지 않고, 테스트는 이것 없이도 돈다.
voice = [
    "faster-whisper>=1.2",
    "melotts",
    "transformers==4.27.4",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "python-mecab-ko>=1.3.7",
    "nvidia-cublas-cu12>=12.8,<13",
    "nvidia-cudnn-cu12>=9,<10",
]

[tool.uv]
override-dependencies = [
    # MeloTTS의 일본어 앞단이 쓰는 mecab-python3: 대소문자를 가리지 않는 파일 시스템에서는 그 `MeCab` 폴더가
    # python-mecab-ko의 `mecab` 폴더와 같은 폴더가 된다. 그래서 Windows에서는 설치하지 않고,
    # voice/speech.py의 `_prepare_melo_on_windows`가 일본어 모듈 자리에 빈 모듈을 넣는다.
    "mecab-python3; sys_platform != 'win32'",
    # unidic 전체 사전은 따로 770 MB를 내려받아야 한다. unidic-lite로 충분하다.
    "unidic; sys_platform == 'never'",
    # gradio는 MeloTTS의 시연 화면만 쓴다. 빼 두면 그 웹 스택이 이 서비스의 웹 스택과 섞이지 않는다.
    "gradio; sys_platform == 'never'",
    # filelock 하한(2026-11-01): MeloTTS가 끌어오는 cached-path 1.8.10은 `filelock<4.0,>=3.4`를 요구하지만,
    # filelock 3.x에는 2026-10에 공개된 권고 13건(CVE-2026-112907 등. 대부분 잠금 파일이나 그 폴더를 같은 PC의
    # 다른 계정이 바꿔치기·선점할 수 있을 때 성립)을 고친 판이 없다(고친 판 4.2.1, 하나는 4.0.9). 그 상한을
    # 덮어 음성 그룹이 4.x를 쓰게 한다. cached-path는 FileLock을 상속해 생성자 인수 read_only_ok를 더하고
    # acquire를 감쌀 뿐이고, FileLock의 생성자·acquire 서명은 3.32.7과 4.2.6에서 같다. cached-path·
    # huggingface_hub·torch의 잠금 사용을 두 판에서 CPU로 확인해 결과가 같았다(docs/voice.md "정한 것과
    # 이유"의 2026-11-01 보탬). filelock은 파일 잠금만 하고 합성·인식 계산에 끼지 않으며 음성 실행의 짝짓기
    # 정보(describe·voice_extra)에도 들어가지 않는다. MeloTTS나 cached-path를 바꿀 때 이 줄을 다시 본다.
    "filelock>=4.2.1",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
melotts = { git = "https://github.com/myshell-ai/MeloTTS.git", rev = "209145371cff8fc3bd60d7be902ea69cbdb7965a" }
torch = [{ index = "pytorch-cu128", group = "voice" }]
torchaudio = [{ index = "pytorch-cu128", group = "voice" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
