[project]
name = "support-agent"
version = "0.1.0"
description = "A Korean customer-support agent that works through tool calls, and a rule-based environment that measures how reliably it does so"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "mcp>=2.2,<3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    # 상한 <2.1(2026-10-30): 하한만 두면 다음 재잠금이 동작이 바뀐 2.1 계열을 조용히 받아들인다.
    # SQLAlchemy 2.1은 Session이 ORM·Core 문을 가리지 않고 실행할 때마다 먼저 autoflush하고,
    # `Select.filter_by()`가 모든 FROM 엔티티에서 이름을 찾으며(겹치면 AmbiguousColumnError), 드라이버를
    # 적지 않은 `postgresql://`의 기본 드라이버를 psycopg 3으로 바꿨다(공식 문서
    # docs.sqlalchemy.org/en/21/changelog/migration_21.html). 이 저장소는 URL에 드라이버를 적고
    # (`postgresql+psycopg://`) filter_by를 엔티티 하나인 select에서만 써서 지금 바로 걸리는 곳은 없다.
    # 다만 flush 시점이 바뀌면 쓰기 도구의 행 잠금(SELECT … FOR UPDATE)·재고 조건부 UPDATE 순서(7cfb5ad)와
    # 섞여 PostgreSQL 경합에서만 드러날 수 있다. 2.1로 올릴 때는 이 상한을 고치고 전체 pytest, compose db를
    # 띄운 tests/test_postgres.py(두 트랜잭션 경합), tests/test_concurrency.py, 음성 그룹 없이 설치한
    # 환경(CI와 같은 조건)을 통과시킨 뒤 잠금을 갱신한다.
    "sqlalchemy>=2.0.30,<2.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]
# Stage 5 only (docs/voice.md): speech synthesis and recognition for the voice channel. Several GB, GPU
# builds of torch. Nothing else imports these, and the tests run without them.
voice = [
    "faster-whisper>=1.2",
    "melotts",
    "transformers==4.27.4",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "python-mecab-ko>=1.3.7",
    "nvidia-cublas-cu12>=12.8,<13",
    "nvidia-cudnn-cu12>=9,<10",
]

[tool.uv]
override-dependencies = [
    # MeloTTS's Japanese front end: on a case-insensitive file system mecab-python3's `MeCab` folder is
    # python-mecab-ko's `mecab` (voice/tts.py stands in for the Japanese module on Windows).
    "mecab-python3; sys_platform != 'win32'",
    # The full unidic dictionary is a separate 770 MB download; unidic-lite is enough.
    "unidic; sys_platform == 'never'",
    # Only MeloTTS's demo page uses gradio; leaving it out keeps its web stack away from ours.
    "gradio; sys_platform == 'never'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
melotts = { git = "https://github.com/myshell-ai/MeloTTS.git", rev = "209145371cff8fc3bd60d7be902ea69cbdb7965a" }
torch = [{ index = "pytorch-cu128", group = "voice" }]
torchaudio = [{ index = "pytorch-cu128", group = "voice" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
