name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
      # tests/test_postgres.py runs only when this is set (a throwaway server for this job)
      SUPPORT_AGENT_TEST_PG_URL: postgresql+psycopg://support:ci-only@127.0.0.1:5432/support
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: support
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U support -d support"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag, so pin the exact release.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -q
